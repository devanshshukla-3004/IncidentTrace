name: Day 22 IncidentTrace tests
on:
  push:
    paths:
      - "**.py"
      - "tests/**"
      - "samples/**"
      - "README.md"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "**.py"
      - "tests/**"
      - "samples/**"
      - "README.md"
      - ".github/workflows/tests.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
      steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
